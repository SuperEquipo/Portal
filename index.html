<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HIGH PLACE - DIAGNÓSTICO</title>

<!-- CONSOLA DE DIAGNÓSTICO VISUAL EN PANTALLA -->
<div id="caja-diagnostico" style="position:fixed; top:0; left:0; right:0; background:#dc2626; color:white; font-size:11px; font-family:monospace; padding:12px; z-index:999999; max-height:220px; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.5); display:none;">
  <div style="font-weight:bold; margin-bottom:6px; border-bottom:1px solid rgba(255,255,255,0.3); padding-bottom:4px;">🐞 CONSOLA DE DIAGNÓSTICO EN VIVO:</div>
  <div id="texto-diagnostico"></div>
</div>

<script>
function logDiagnostico(msg) {
  const box = document.getElementById('caja-diagnostico');
  const text = document.getElementById('texto-diagnostico');
  if (box && text) {
    box.style.display = 'block';
    text.innerHTML += "• " + msg + "<br>";
  }
}

// Captura de errores globales de JavaScript
window.onerror = function(message, source, lineno, colno, error) {
  logDiagnostico("ERROR JS: " + message + " (Línea: " + lineno + ")");
  return false;
};

// Captura de errores de red o promesas (fetch)
window.onunhandledrejection = function(event) {
  logDiagnostico("ERROR RED/FETCH: " + (event.reason ? (event.reason.message || event.reason) : event));
};
</script>

<style>
body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0f172a; }
iframe { width: 100%; height: 100%; border: none; display: block; position: absolute; top: 0; left: 0; z-index: 10; opacity: 0; transition: opacity 0.5s ease; }
#splash {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; color: white; font-family: sans-serif;
}
.spinner {
  width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid #3b82f6; border-radius: 50%;
  animation: spin 1s linear infinite; margin-bottom: 20px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="splash">
  <div class="spinner"></div>
  <h2 style="margin:0; font-size:16px; font-weight:600;">Cargando diagnóstico...</h2>
</div>

<iframe id="pantalla-app" allow="camera; microphone; fullscreen; geolocation"></iframe>

<script>
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const parametrosWeb = window.location.search;
const urlGoogleScript = "https://script.google.com/macros/s/AKfycbwy2UV4XzREfRpIX45eZq4wZ9gO_O_QM79z8r3l0mbX64XC6-sG_KJCYRUkQxDj5tllWw/exec";

// Log inicial de entorno
logDiagnostico("Sistema detectado: " + (isIOS ? "iOS (iPhone)" : "Android/PC"));
logDiagnostico("Parámetros URL recibidos: " + (parametrosWeb || "NINGUNO (Falta ?id=...)"));

if (!parametrosWeb.includes("id=")) {
  logDiagnostico("⚠️ ADVERTENCIA: La URL no contiene el ID del cliente. Falta '?id=...'");
}

const iframe = document.getElementById("pantalla-app");
const splash = document.getElementById("splash");

const urlFinal = urlGoogleScript + parametrosWeb;
logDiagnostico("Intentando cargar destino: " + urlFinal);

iframe.src = urlFinal;

iframe.onload = function() {
  logDiagnostico("✅ Iframe cargado con éxito en el navegador.");
  splash.style.opacity = "0";
  setTimeout(() => splash.style.display = "none", 500);
  iframe.style.opacity = "1";
};

iframe.onerror = function() {
  logDiagnostico("❌ ERROR CRÍTICO: El navegador ha bloqueado la carga del Iframe.");
};
</script>
</body>
</html>
